# RegReport en Docker.
#
#   docker compose up -d --build            → app seule (base SQL existante)
#   docker compose --profile with-sql up -d → app + SQL Server 2022 de test
#
# Voir docs/DOCKER.md — notamment pour l'authentification Windows (le
# conteneur tourne en Security:Mode=None par défaut : à réserver à un
# environnement TEST, ou à placer derrière un reverse proxy qui authentifie).
services:
  regreport:
    build:
      context: .
    image: regreport:latest
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Libellé du badge d'environnement dans le header (PROD/TEST/DEV/…).
      App__EnvironmentLabel: TEST
      # Base applicative — pointer vers votre SQL Server (auth SQL, pas
      # d'Integrated Security dans un conteneur Linux) :
      ConnectionStrings__Default: "Server=sql;Database=RegReport;User Id=sa;Password=${SQL_SA_PASSWORD:-RegReport!2026};TrustServerCertificate=True"
      # MERCURY (optionnel) :
      # ConnectionStrings__Mercury: "Server=...;Database=MERCURY;User Id=...;Password=...;TrustServerCertificate=True"
      Security__Mode: "None"
    depends_on:
      sql:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # SQL Server de test (profil optionnel) — les données persistent dans le
  # volume nommé ; l'API crée le schéma au premier démarrage (EnsureCreated
  # + migrateur intégré).
  sql:
    profiles: ["with-sql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-RegReport!2026}
    ports:
      - "1433:1433"
    volumes:
      - regreport-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  regreport-sql:
